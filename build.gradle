plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.group
base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    mods {
        "signtp" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    // Local jars are used for compilation so the build does not need to
    // download the whole Fabric API tree from Maven. At runtime, put the
    // official Fabric API jar in the server's mods folder as usual.
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api-base:1.0.5+4ebb5c083e"
    modImplementation "net.fabricmc.fabric-api:fabric-events-interaction-v0:4.1.1+3b89ecf63e"
    modImplementation "net.fabricmc.fabric-api:fabric-networking-api-v1:5.1.6+6b6d71a53e"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName
    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}
